      const rv=D.reviews.find(x=>x.request_id===r.id);
      if(rv)h+='<div class="card"><div class="title">'+esc(t('myRev'))+'</div><span class="stars">'+'★'.repeat(rv.stars)+'☆'.repeat(5-rv.stars)+'</span><p class="muted">'+esc(rv.comment||'')+'</p></div>';
      else h+='<div class="card"><div class="title">'+esc(t('rateT'))+'</div><form data-form="review" data-id="'+esc(r.id)+'" data-helper="'+esc(accepted.helper_id)+'"><input type="hidden" name="stars" value="5"><div class="starpick" id="starpick">'+[1,2,3,4,5].map(i=>'<button type="button" class="on" data-act="star" data-v="'+i+'" aria-label="'+i+'">★</button>').join('')+'</div><label class="l">'+esc(t('cmt'))+'</label><textarea name="comment" placeholder="'+esc(t('cmtPh'))+'"></textarea><button class="btn btn-primary btn-full" type="submit">'+esc(t('pubRev'))+'</button></form></div>';
    }
  }
  if((isOwner||isAcceptedHelper)&&accepted&&(r.status==='en_cours'||r.status==='terminee')){
    h+='<details class="card" id="repbox" style="margin-top:12px"><summary style="cursor:pointer;font-weight:700;color:var(--terra2)">⚠️ '+esc(t('reportBtn'))+'</summary>'
      +'<form data-form="report" data-id="'+esc(r.id)+'" style="margin-top:10px"><label class="l">'+esc(t('reportReason'))+'</label><select name="reason">'+['noresp','pay','work','abuse','other'].map(k=>'<option value="'+k+'">'+esc(t('rp_'+k))+'</option>').join('')+'</select>'
      +'<label class="l">'+esc(t('reportDet'))+'</label><textarea name="details" required></textarea><button class="btn btn-danger btn-full" type="submit">'+esc(t('reportSend'))+'</button></form></details>';
  }
  return h;
}
function offerCard(o,r){
  const hp=pget(o.helper_id)||{};
  return '<div class="card"><div class="row between"><b>'+esc(pname(o.helper_id))+'</b>'+ratingHtml(o.helper_id)+'</div>'
    +'<div class="row" style="gap:4px;margin:2px 0">'+(hp.verified?'<span class="badge ok">'+esc(t('bHelperOk'))+'</span>':'')+confBadge(hp)+'</div>'
    +'<p class="muted">📍 '+esc(cityName(hp.city||''))+(o.delay_days?' · '+esc(t('delayD',{n:o.delay_days})):'')+'</p>'
    +priceLines(o,true,false)+planHtml(o,false,false)
    +(o.note?'<p style="margin-top:10px;font-size:13.5px;white-space:pre-wrap">'+esc(o.note)+'</p>':'')
    +'<button class="btn btn-primary btn-full" data-act="accept" data-id="'+esc(r.id)+'" data-offer="'+esc(o.id)+'">'+esc(t('accept'))+'</button></div>';
}

/* ====== Actions ====== */
async function loadMe(){
  if(!state.session||!state.session.user){state.me=null;return;}
  const A=api();
  const p=await A.getProfile(state.session.user.id);
  if(p){p.phone=await A.getPhone(p.id);}
  state.me=p;
}
async function afterLogin(){
  await loadMe();
  if(state.me){await go('list');}
  else{state.setupRole='mre';state.draft=null;await go('setup');}
}
async function logout(){
  await safe(t('logout'),async()=>{await api().signOut();});
  state.session=null;state.me=null;LS.del('session');
  state.data={requests:[],offers:[],profiles:[],reviews:[],reports:[]};
  await go('auth');
}
const actions={
  go(el){go(el.dataset.view,{id:el.dataset.id});},
  home(){go(state.me?'list':'auth');},
  open(el){go('detail',{id:el.dataset.id});},
  start(el){LS.set('welcomed','1');state.authTab=el.dataset.tab;go('auth');},
  async install(){const e=window.__pwaPrompt;if(!e)return;e.prompt();try{await e.userChoice;}catch(_){}window.__pwaPrompt=null;render();},
  tab(el){state.authTab=el.dataset.tab;render();},
  role(el){
    const f=el.closest('form');
    if(f){state.draft={name:f.elements.name.value,phone:f.elements.phone.value};}
    state.setupRole=el.value;render();
  },
  filter(){state.filterCity=!state.filterCity;render();},
  logout(){return logout();},
  star(el){
    const v=Number(el.dataset.v);
    const f=el.closest('form');f.elements.stars.value=v;
    el.parentNode.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i<v));
  },
  async demo(el){
    await safe('Demo',async()=>{
      Local.seedDemo();
      await Local.signIn(el.dataset.who,'demo');
      await afterLogin();
    });
  },
  async accept(el){
    if(!confirm(t('confAccept')))return;
    await safe(t('accept'),async()=>{await api().acceptOffer(el.dataset.id,el.dataset.offer);toast(t('acceptedPay'));await go('detail',{id:el.dataset.id});});
  },
  async cancel(el){
    if(!confirm(t('confCancel')))return;
    await safe(t('cancelReq'),async()=>{await api().setRequestStatus(el.dataset.id,'annulee');toast(t('cancelled'),'warn');await go('list');});
  },
  async done(el){
    if(!confirm(t('confDone')))return;
    await safe(t('markDone'),async()=>{await api().setRequestStatus(el.dataset.id,'terminee');toast(t('doneToast'));await go('detail',{id:el.dataset.id});});
  },
  async verify(el){
    if(el.dataset.v==='1'){
      const st=adminStats();
      if(!confirm(t('confValidate')+(st.avail>st.open?'\n\n'+t('confValidateExtra'):'')))return;
    }
    await safe(t('validate'),async()=>{await api().setVerified(el.dataset.id,el.dataset.v==='1');toast(el.dataset.v==='1'?t('vOk'):t('vNo'),'warn');await go('admin');});
  },
  checkall(el){const f=el.closest('form');f.querySelectorAll('input[name=rule]').forEach(c=>{c.checked=true;});},
  atab(el){state.adminTab=el.dataset.tab;render();},
  csv(){csvExport();},
  async avail(el){
    await safe(t('availOn'),async()=>{await api().setFlag(state.me.id,'available',el.dataset.v==='1');await go('profile');});
  },
  async flag(el){
    const f=el.dataset.field,v=el.dataset.v==='1';
    await safe(t('btnConf'),async()=>{
      await api().setFlag(el.dataset.id,f,v);
      toast(f==='confirmed'?(v?t('vConf'):t('vUnconf')):(v?t('suspOk'):t('suspNo')),'warn');await go('admin');
    });
  },
  async paid(el){
    const D=state.data,o=D.offers.find(x=>x.id===el.dataset.id);
    if(!o)return;
    if(!confirm(t('confPaid',{x:money(o.commission_amount),y:pname((D.requests.find(r=>r.id===o.request_id)||{}).mre_id)})))return;
    await safe(t('markPaid'),async()=>{
      await api().markPaid(o.id);toast(t('paidDone'));
      if(el.dataset.back==='detail')await go('detail',{id:o.request_id});else await go('admin');
    });
  },
  async release(el){
    if(!confirm(t('confRelease')))return;
    await safe(t('releaseBtn'),async()=>{await api().releaseRequest(el.dataset.id,el.dataset.offer);toast(t('released'),'warn');await go('admin');});
  },
  async repclose(el){
    await safe(t('repClose'),async()=>{await api().closeReport(el.dataset.id);toast(t('repClosed'));await go('admin');});
  },
  usedemo(){state.mode='local';LS.set('mode','local');state.session=null;state.me=null;LS.del('session');toast(t('demoOn'),'warn');go('auth');},
  resetdemo(){
    if(!confirm(t('confClear')))return;
    LS.del('db');LS.del('settings');state.session=null;state.me=null;LS.del('session');toast(t('cleared'),'warn');go('auth');
  }
};
const forms={
  async auth(f){
    const email=f.email.value.trim(),pw=f.pw.value;
    await safe(state.authTab==='up'?t('signup'):t('login'),async()=>{
      if(state.authTab==='up'){
        const r=await api().signUp(email,pw);
        if(r.needsConfirm){toast(t('accCreated'),'warn');state.authTab='in';render();return;}
      }else{await api().signIn(email,pw);}
      await afterLogin();
    });
  },
  async setup(f){
    const edit=!!state.me;
    const role=edit?state.me.role:(f.role?f.role.value:state.setupRole);
    const svc=Array.from(f.querySelectorAll('input[name=svc]:checked')).map(x=>x.value);
    if(role==='helper'&&!svc.length){showError(t('completeP'),t('needSvc'));return;}
    const p={id:state.session.user.id,name:f.elements.name.value.trim(),role,phone:f.phone.value.trim(),city:role==='helper'?f.city.value:null,country:role==='mre'?f.country.value.trim():null,services:role==='helper'?svc:[],transport_ok:!!(f.transport&&f.transport.checked)};
    await safe(t('editP'),async()=>{await api().saveProfile(p);await loadMe();toast(t('saved'));await go(edit?'profile':'list');});
  },
  async newreq(f){
    await safe(t('newReq'),async()=>{
      await api().createRequest({mre_id:state.me.id,type:f.type.value,city:f.city.value,description:f.description.value.trim(),budget:f.budget.value?Number(f.budget.value):null,urgent:!!f.urgent.checked});
      toast(t('published'));await go('list');
    });
  },
  async offer(f){
    const id=f.dataset.id;
    await safe(t('sendOffer'),async()=>{
      await api().createOffer({request_id:id,helper_id:state.me.id,price:Number(f.price.value),official_fees:Number(f.fees.value||0),delay_days:f.delay.value?Number(f.delay.value):null,note:f.note.value.trim()});
      toast(t('offerSent'));await go('detail',{id});
    });
  },
  async proof(f){
    const id=f.dataset.id;
    await safe(t('addProof'),async()=>{
      let image=null;
      if(f.photo.files&&f.photo.files[0])image=await resizeImage(f.photo.files[0],900);
      await api().addProof({request_id:id,author_id:state.me.id,note:f.note.value.trim(),image});
      toast(t('proofAdded'));await go('detail',{id});
    });
  },
  async review(f){
    const id=f.dataset.id;
    await safe(t('pubRev'),async()=>{
      await api().addReview({request_id:id,helper_id:f.dataset.helper,mre_id:state.me.id,stars:Number(f.stars.value),comment:f.comment.value.trim()});
      toast(t('thanks'));await go('detail',{id});
    });
  },
  async commission(f){
    const pct=Math.max(0,Math.min(MAXCOM,Number(f.pct.value)||0));
    await safe(t('comT'),async()=>{await api().setSettings({commission_pct:pct});toast(t('comSaved'));state.adminTab='set';await go('admin');});
  },
  async paysettings(f){
    const dep=Math.max(0,Math.min(80,Number(f.dep.value)||0));
    await safe(t('depT'),async()=>{await api().setSettings({deposit_pct:dep,pay_info:f.payinfo.value.trim()});toast(t('setSaved'));state.adminTab='set';await go('admin');});
  },
  async accept(f){
    if(Array.from(f.querySelectorAll('input[name=rule]')).some(c=>!c.checked)){showError(t('acceptT'),t('acceptNeed'));return;}
    await safe(t('acceptBtn'),async()=>{await api().acceptRules();await loadMe();toast(t('acceptedOk'));await go('list');});
  },
  async report(f){
    const id=f.dataset.id;
    await safe(t('reportBtn'),async()=>{await api().createReport({request_id:id,reason:f.reason.value,details:f.details.value.trim()});toast(t('reportSent'),'warn');await go('detail',{id});});
  },
  async settings(f){
    const url=f.url.value.trim(),key=f.key.value.trim();
    if(!url||!key){showError(t('setT'),t('needCfg'));return;}
    if(!/^https:\/\/.+/.test(url)){showError(t('setT'),t('needHttps'));return;}
    state.cfg={url,key};LS.set('cfg',state.cfg);
    const prev=state.mode;
    await safe(t('saveTest'),async()=>{
      state.mode='supabase';
      try{await Remote.ping();}catch(e){state.mode=prev;render();throw e;}
      LS.set('mode','supabase');state.session=null;state.me=null;LS.del('session');
      toast(t('connOk'));await go('auth');
    });
  }
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el||el.tagName==='INPUT')return;
  const fn=actions[el.dataset.act];if(!fn)return;
  Promise.resolve().then(()=>fn(el,e)).catch(err=>showError('Action',err));
});
document.addEventListener('change',e=>{
  const el=e.target;if(!el)return;
  if(el.dataset&&el.dataset.act==='role'){actions.role(el);return;}
  if(el.id==='langsel'){
    LANG=el.value;LS.set('lang',LANG);
    const f=document.querySelector('form[data-form=auth]');
    render();return;
  }
  if(el.id==='typesel'){const d=$('#dochint');if(d)d.innerHTML='<b>'+esc(t('docsT'))+' :</b> '+esc(t('d_'+el.value));}
});
document.addEventListener('input',e=>{
  const el=e.target;if(!el||!el.form)return;
  const fd=el.form.dataset.form;
  if(fd==='offer'&&el.name==='price'){
    const p=$('#offprev');if(!p)return;
    const price=Number(el.value)||0,pct=Number(p.dataset.pct)||0,ca=commAmt(price,pct);
    $('#pv-c').innerHTML=mh(ca);$('#pv-t').innerHTML=mh(price+ca);
  }
  if(fd==='commission'&&el.name==='pct'){const v=$('#pctv');if(v)v.textContent=el.value+' %';}
  if(fd==='paysettings'&&el.name==='dep'){const v=$('#depv');if(v)v.textContent=el.value+' %';}
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();
  const fn=forms[f.dataset.form];if(!fn)return;
  Promise.resolve().then(()=>fn(f)).catch(err=>showError('Form',err));
});
window.addEventListener('error',e=>showError('App',e.error||e.message));
window.addEventListener('unhandledrejection',e=>showError('App',e.reason));
window.APP={state,loadMe,actions,forms,go,Local,Remote,render,T,LANGS,setLang(l){LANG=l;LS.set('lang',l);render();}};

/* ====== Démarrage ====== */
async function init(){
  applyLang();render();
  if(state.session&&state.session.user){
    await safe('Session',async()=>{await loadMe();});
    if(state.me){await go('list');return;}
    if(state.session){state.setupRole='mre';await go('setup');return;}
  }
  await go(LS.get('welcomed')?'auth':'welcome');
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
</script></body></html>
